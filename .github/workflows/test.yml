name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: sudo apt-get update && sudo apt-get install -y tmux

      - run: npm ci

      - run: npm test

      - name: Verify systemd unit
        run: |
          sed "s#/ABSOLUTE/PATH/TO/agent-wrangler#$PWD#g" scripts/agent-wrangler.service.example > /tmp/agent-wrangler.service
          systemd-analyze verify --user /tmp/agent-wrangler.service
