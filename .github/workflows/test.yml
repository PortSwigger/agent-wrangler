name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: sudo apt-get update && sudo apt-get install -y tmux

      - run: npm ci

      # The acceptance test drives real headless Chrome over CDP. ubuntu-latest ships
      # google-chrome-stable; AW_REQUIRE_BROWSER makes the test FAIL rather than skip if
      # a future runner image drops it, so it can't quietly stop covering anything.
      - name: Locate Chrome
        run: |
          which google-chrome-stable google-chrome chromium-browser chromium || true
          google-chrome-stable --version || chromium-browser --version || true

      - run: npm test
        env:
          AW_REQUIRE_BROWSER: '1'

      - name: Verify systemd unit
        run: |
          sed "s#/ABSOLUTE/PATH/TO/agent-wrangler#$PWD#g" scripts/agent-wrangler.service.example > /tmp/agent-wrangler.service
          systemd-analyze verify --user /tmp/agent-wrangler.service
