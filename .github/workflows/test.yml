name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: sudo apt-get update && sudo apt-get install -y tmux

      - run: npm ci

      # The acceptance test drives real headless Chrome over CDP. ubuntu-latest ships
      # google-chrome-stable; AW_REQUIRE_BROWSER makes the test FAIL rather than skip if
      # a future runner image drops it, so it can't quietly stop covering anything.
      - name: Locate Chrome
        run: |
          which google-chrome-stable google-chrome chromium-browser chromium || true
          google-chrome-stable --version || chromium-browser --version || true

      - run: npm test
        env:
          AW_BROWSER_TESTS: '1'
          AW_REQUIRE_BROWSER: '1'

      # agy's conversation reader needs node:sqlite (Node 22.5+), so its tests skip on
      # the Node 20 run above. Run them again on Node 22, where skipping fails.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node --test --import ./server/test-setup.js server/agents/agy.test.js
        env:
          AW_REQUIRE_SQLITE: '1'

      - name: Verify systemd unit
        run: |
          sed "s#/ABSOLUTE/PATH/TO/agent-wrangler#$PWD#g" scripts/agent-wrangler.service.example > /tmp/agent-wrangler.service
          systemd-analyze verify --user /tmp/agent-wrangler.service
